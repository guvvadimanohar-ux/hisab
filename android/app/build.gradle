plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.hisab.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.hisab.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures { buildConfig true }
    flavorDimensions 'connection'
    productFlavors {
        offline {
            dimension 'connection'
            applicationIdSuffix '.offline'
            buildConfigField 'boolean', 'ONLINE_EDITION', 'false'
            resValue 'string', 'app_name', 'Hisab AI Offline'
        }
        online {
            dimension 'connection'
            applicationIdSuffix '.online'
            buildConfigField 'boolean', 'ONLINE_EDITION', 'true'
            resValue 'string', 'app_name', 'Hisab AI Online'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
